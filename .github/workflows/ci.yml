name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Download v0 spec
      run: |
        curl -fsSL \
          "https://github.com/RaspberryPiFoundation/documentation/raw/cae831932308c884fc81cd5b106cc722b106e582/docs/technology/codebases-and-products/raspberry-flavoured-markdown/kramdown-rpf-v0-spec.md" \
          -o kramdown-rpf-v0-spec.md

    - name: Run tests
      run: bundle exec rake spec
      env:
        SPEC_MD: kramdown-rpf-v0-spec.md

  publish:
    needs: [lint, test, spec]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Build gem
      run: bundle exec rake build

    - name: Publish to GitHub Packages
      run: |
        mkdir -p ~/.gem
        cat << EOF > ~/.gem/credentials
        ---
        :github: Bearer ${GITHUB_TOKEN}
        EOF
        chmod 0600 ~/.gem/credentials
        gem push --key github --host https://rubygems.pkg.github.com/RaspberryPiFoundation pkg/*.gem
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: pkg/*.gem
        generate_release_notes: true
